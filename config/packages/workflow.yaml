framework:
    workflows:
        tutorial_publishing:
            type: 'state_machine'
            audit_trail:
                enabled: true
            marking_store:
                type: 'method'
                property: 'status'
            supports:
                - App\Entity\Tutorial
            places:
                - draft
                - review
                - published
                - rejected
            transitions:
                to_review:
                    from: [draft, rejected]
                    to:   review
                publish:
                    from: review
                    to:   published
                reject:
                    from: review
                    to:   rejected